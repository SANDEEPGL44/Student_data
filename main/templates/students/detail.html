<!DOCTYPE html>
<html>
<head>
    <title>Student Detail</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25);
            animation: fadeIn 0.4s ease;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #764ba2;
            margin-bottom: 25px;
        }

        .info {
            font-size: 15px;
            margin: 12px 0;
            color: #333;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        a {
            display: block;
            margin-top: 25px;
            text-align: center;
            text-decoration: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Student Detail</h2>

        <p class="info"><span class="label">Name:</span> {{ student.name }}</p>
        <p class="info"><span class="label">Age:</span> {{ student.age }}</p>
        <p class="info"><span class="label">Course:</span> {{ student.course }}</p>

        <a href="/students/">Back</a>
    </div>

</body>
</html>
