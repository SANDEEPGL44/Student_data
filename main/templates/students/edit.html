<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.35s ease;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #11998e;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #11998e;
            box-shadow: 0 0 0 2px rgba(17,153,142,0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        a {
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #11998e;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Edit Student</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Name:</label><br>
            <input type="text" name="name" value="{{ student.name }}" required><br><br>

            <label>Age:</label><br>
            <input type="number" name="age" value="{{ student.age }}" required><br><br>

            <label>Course:</label><br>
            <select name="course" required>
                <option value="">Select Course</option>

                {% for course in courses %}
                    <option value="{{ course.id }}"
                        {% if student.course.id == course.id %}selected{% endif %}>
                        {{ course.title }}
                    </option>
                {% endfor %}
            </select><br><br>

            <button type="submit">Update Student</button>
        </form>

        <a href="{% url 'students' %}">Back to Student List</a>
    </div>

</body>
</html>
